<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTP +Lab | Iniciar Sesión</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Propio -->
    <link rel="stylesheet" th:href="@{/styles-login.css}">
</head>
<style>
    body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: #ffffff;
    color: #2b2b2b;
    height: 100vh;
    overflow: hidden;
}

.login-container {
    display: flex;
    height: 100vh;
    width: 100vw;
}

/* --- PANEL IZQUIERDO --- */
.left-panel {
    background-color: #eaf0f8;
    width: 48%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 2rem;
    text-align: center;
}

.illustration-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 2rem;
}

.microscope-img {
    max-width: 260px;
    height: auto;
    margin-bottom: 1rem;
}

.brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
}

.badge-utp {
    background-color: #000000;
    color: #ffffff;
    font-weight: 800;
    font-size: 0.85rem;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.5px;
}

.badge-lab {
    color: #0d6efd;
    font-weight: 700;
    font-size: 1.05rem;
}

.panel-title {
    color: #6b7c96;
    font-size: 0.95rem;
    margin-top: 1.5rem;
    line-height: 1.4;
}

.panel-subtitle {
    color: #556070;
    font-weight: 600;
}

/* --- PANEL DERECHO --- */
.right-panel {
    width: 52%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem 4rem;
    background-color: #ffffff;
}

.form-wrapper {
    width: 100%;
    max-width: 440px;
}

.header-title {
    font-size: 1.65rem;
    font-weight: 700;
    color: #1a2533;
    line-height: 1.25;
    margin-top: 1.5rem;
    margin-bottom: 0.5rem;
}

.header-subtitle {
    color: #7a889b;
    font-size: 0.95rem;
    margin-bottom: 2rem;
}

.instruction-text {
    font-size: 0.95rem;
    color: #2b2b2b;
    margin-bottom: 1.2rem;
}

.form-group {
    margin-bottom: 1.2rem;
}

.form-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #3e4c5e;
    margin-bottom: 0.4rem;
}

.input-container {
    position: relative;
    display: flex;
    align-items: center;
}

.custom-input {
    width: 100%;
    padding: 0.75rem 2.5rem 0.75rem 1rem;
    background-color: #f7f9fc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 0.9rem;
    color: #2d3748;
    outline: none;
    transition: all 0.2s ease;
}

.custom-input:focus {
    background-color: #ffffff;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.input-icon {
    position: absolute;
    right: 12px;
    color: #a0aec0;
    cursor: pointer;
}

.help-text {
    font-size: 0.75rem;
    color: #94a3b8;
    margin-top: 0.35rem;
    display: flex;
    align-items: center;
    gap: 4px;
}

.forgot-password {
    text-align: right;
    margin-top: 0.5rem;
    margin-bottom: 1.5rem;
}

.forgot-password a {
    color: #2563eb;
    font-size: 0.85rem;
    text-decoration: none;
    font-weight: 500;
}

.btn-submit {
    width: 100%;
    padding: 0.8rem;
    background-color: #2563eb;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
}

.btn-submit:hover {
    background-color: #1d4ed8;
}

/* Responsive para pantallas pequeñas */
@media (max-width: 900px) {
    .left-panel {
        display: none;
    }
    .right-panel {
        width: 100%;
        padding: 2rem;
    }
}
</style>
<body>

    <div class="login-container">
        
        <!-- SECCIÓN IZQUIERDA (Ilustración y Marca) -->
        <div class="left-panel">
            <div class="illustration-box">
                <!-- Imagen SVG/Icono representativo de microscopio y laboratorios -->
                <img th:src="@{/images/lab-illustration.png}" 
                    src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png" 
                    alt="UTP Lab Ilustración" 
                    class="microscope-img">
                
                <div class="brand-badge">
                    <span class="badge-utp">UTP</span>
                    <span class="badge-lab">+Lab</span>
                </div>
            </div>
            <p class="panel-title">
                La nueva experiencia digital de aprendizaje.<br>
                <strong class="panel-subtitle">Cercana, dinámica y flexible.</strong>
            </p>
        </div>

        <!-- SECCIÓN DERECHA (Formulario de Login) -->
        <div class="right-panel">
            <div class="form-wrapper">
                
                <!-- Logo UTP +Lab -->
                <div class="brand-badge">
                    <span class="badge-utp">UTP</span>
                    <span class="badge-lab">+Lab</span>
                </div>

                <!-- Título -->
                <h2 class="header-title">La nueva experiencia digital de aprendizaje</h2>
                <p class="header-subtitle">Cercana, dinámica y flexible</p>

                <p class="instruction-text">Ingresa tus datos para <strong>iniciar sesión.</strong></p>

                <!-- Alerta de error si falla la autenticación -->
                <div th:if="${error}" class="alert alert-danger py-2 mb-3" role="alert" style="font-size: 0.85rem;">
                    <i class="fa-solid fa-circle-exclamation me-1"></i> <span th:text="${error}"></span>
                </div>

                <!-- Formulario -->
                <form th:action="@{/login}" method="post">
                    
                    <!-- Campo Código UTP -->
                    <div class="form-group">
                        <label for="codigoUtp" class="form-label">Código UTP</label>
                        <div class="input-container">
                            <input type="text" 
                                    id="codigoUtp" 
                                    name="codigoUtp" 
                                    class="custom-input" 
                                    placeholder="Ingresa tu usuario" 
                                    required 
                                    autofocus>
                            <i class="fa-solid fa-user-large input-icon"></i>
                        </div>
                        <p class="help-text">
                            <i class="fa-regular fa-circle-info"></i> Ejemplo de usuario: U1533149 (no digitar el @utp.edu.pe)
                        </p>
                    </div>

                    <!-- Campo Contraseña -->
                    <div class="form-group">
                        <label for="password" class="form-label">Contraseña</label>
                        <div class="input-container">
                            <input type="password" 
                                    id="password" 
                                    name="password" 
                                    class="custom-input" 
                                    placeholder="Ingresa tu contraseña" 
                                    required>
                            <i class="fa-regular fa-eye input-icon" id="togglePassword"></i>
                        </div>
                    </div>

                    <!-- Olvidaste contraseña -->
                    <div class="forgot-password">
                        <a href="#">Restablecer contraseña</a>
                    </div>

                    <!-- Botón Iniciar Sesión -->
                    <button type="submit" class="btn-submit">Iniciar sesión</button>

                </form>

            

            </div>
        </div>

    </div>

    <!-- Script para funcionalidad de ver contraseña y autocompletar demo -->
    <script>
        // Ver / Ocultar Contraseña
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        
    </script>
</body>
</html>
